<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English for IT: Vadim</title>
<style>
:root{color-scheme:dark;--bg:#0e1621;--card:#16212e;--ink:#dbe4ee;--mut:#8a9bb0;--acc:#5ad1e6;--amb:#f4b860;--line:#26364a;--mono:"JetBrains Mono","SF Mono",Consolas,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:880px;margin:auto;padding:36px 20px 70px}
h1,h2,h3{font-family:var(--mono);font-weight:600}
h1{font-size:1.8rem;margin:0 0 6px}
h1:before{content:"> ";color:var(--acc)}
.sub{color:var(--mut);margin:0 0 22px}
.goals{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:30px}
.goals span{font:.85rem var(--mono);color:var(--amb);border:1px solid var(--amb);border-radius:14px;padding:3px 12px}
h2{font-size:1.1rem;color:var(--amb);margin:28px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;color:inherit;text-decoration:none;box-shadow:inset 0 2px 0 var(--acc)}
a.card:hover{border-color:var(--acc)}
.card h3{margin:0 0 4px;font-size:1rem;color:var(--acc)}
.card p{margin:0 0 8px;color:var(--ink);font-size:.95rem}
.card small{font:.8rem var(--mono);color:var(--mut)}
.lw{display:flex;flex-direction:column}
.lw .card{flex:1;border-bottom-left-radius:0;border-bottom-right-radius:0}
.hw{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-top:1px dashed var(--line);border-radius:0;padding:9px 16px;color:inherit;text-decoration:none;font:.85rem var(--mono)}
.hw:last-child{border-radius:0 0 8px 8px}
.hw b{color:var(--amb)}
.hw span{color:var(--mut)}
.hw:hover{border-color:var(--amb)}
.soon{opacity:.5;box-shadow:inset 0 2px 0 var(--line);border-style:dashed}
.soon h3{color:var(--mut)}
:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>English for IT: Vadim</h1>
<p class="sub">Welcome, Vadim! Your English isn’t broken, it’s just in beta. Thanks for showing up, and good luck: ship it!</p>
<div class="goals"><span>colleagues</span><span>clients</span><span>interviews</span><span>technical vocabulary</span><span>grammar in action</span></div>
<div id="units"></div>
</main>
<script>
/* Add a new unit here (optional hw:{t,d,href} or an array of them adds homework links under a lesson): copy a block, change the title and the lessons. Use href:null for lessons not uploaded yet. */
const UNITS=[
{t:"Unit 1: Living in a Digital Age",l:[
{t:"Lesson 1",d:"The digital age, vocabulary and collocations, greetings and titles at work.",m:"60 min · speaking + listening",href:"formal-informal-lessons.html#1",hw:[{t:"Homework 1",d:"20 gap-fills · result sent to Julia",href:"homework-unit1-lesson1.html"},{t:"Homework 2",d:"30 gap-fills · result sent to Julia",href:"homework-unit1-lesson2.html"}]},
{t:"Lesson 2",d:"Computers at work, experience in interviews, requests and instructions.",m:"60 min · speaking + listening",href:"formal-informal-lessons.html#2",hw:[{t:"Homework 2.1",d:"30 gap-fills · result sent to Julia",href:"homework-unit1-lesson2-1.html"}]}]},
{t:"Unit 2",l:[{t:"Lesson 3",d:"Coming soon",m:"",href:null},{t:"Lesson 4",d:"Coming soon",m:"",href:null}]},
{t:"Unit 3",l:[{t:"Lesson 5",d:"Coming soon",m:"",href:null},{t:"Lesson 6",d:"Coming soon",m:"",href:null}]}
];
document.getElementById("units").innerHTML=UNITS.map(u=>`<h2>// ${u.t}</h2><div class="grid">${u.l.map(x=>{
 const i=`<h3>${x.t}</h3><p>${x.d}</p><small>${x.m||"not uploaded yet"}</small>`;
 if(!x.href)return `<div class="card soon">${i}</div>`;
 const hw=[].concat(x.hw||[]).map(w=>`<a class="hw" href="${w.href}"><b>${w.t}</b><span>${w.d}</span></a>`).join("");
 return `<div class="lw"><a class="card" href="${x.href}">${i}</a>${hw}</div>`}).join("")}</div>`).join("");
</script>
</body>
</html>
