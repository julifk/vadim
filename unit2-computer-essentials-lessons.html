const L={

{t:"Read the text, then explain the diagram",m:12,s:["Reading","Speaking"],w:[
raw('<h4>Text: What is a computer?</h4><div class="txt"><p>A computer is an electronic machine that accepts data, processes it and gives the result in a useful form. First, data is entered into the computer’s memory. Then the program runs and the computer follows its instructions. Finally, we see the results, the output, on the screen or on paper.</p><p>A computer system has two parts: hardware and software. <b>Hardware</b> is any physical part that you can see or touch. <b>Software</b> is a set of instructions, called a program, which tells the computer what to do.</p><p>There are three basic hardware sections: the <b>central processing unit (CPU)</b>, <b>main memory</b> and <b>peripherals</b>. The CPU is the brain of the computer. It executes the program and coordinates the other parts. Main memory holds the instructions and the data while they are processed.</p><p>Peripherals are the devices attached to the computer. <b>Input devices</b>, such as the mouse and keyboard, put data into the computer. <b>Output devices</b>, such as the monitor and printer, show us the results. <b>Storage devices</b>, such as hard drives and flash drives, keep data and programs permanently. <b>Ports</b> on the computer let us plug in other peripherals, for example a camera or a scanner.</p></div>'),

/* ---------- engine ---------- */
const app=document.getElementById("app");
const choice=(opts,vals,ans)=>`<span class="ch" data-a="${ans}">${opts.map((o,j)=>`<button type="button" class="cb" data-o="${vals[j]}">${o}</button>`).join("")}</span>`;
function wid(w){
 if(w.k==="raw")return `<div class="w">${w.html}</div>`;
 let h=`<div class="w"><h4>${w.title}</h4>`+(w.how?`<p class="note">${w.how}</p>`:"");
 const btn=`<button class="b" data-do="chk">Run check</button><button class="b" data-do="key">Reveal answers</button> <span class="sc"></span>`;
 if(w.k==="say")h+="<ul>"+w.items.map(i=>`<li>${i}</li>`).join("")+"</ul>";
 if(w.k==="sel")h+=w.items.map(i=>`<div class="r"><span>${i[2]?spb(i[2]):""}${i[0]}</span>${choice(w.opts,w.opts.map((_,j)=>j),i[1])}</div>`).join("")+btn;
 if(w.k==="gap")h+=w.items.map(i=>`<div class="r"><span>${i[0]}${w.bank?choice(w.bank,w.bank,i[1].join("|")):`<input class="g" data-a="${i[1].join("|")}" aria-label="gap" autocomplete="off">`} ${i[2]||""}</span></div>`).join("")+btn;
 if(w.k==="open")h+=w.items.map(i=>`<div class="r"><span>${i[0]}<div class="ans">${i[1]}</div></span><button class="b sm" data-do="rev">Show answer</button></div>`).join("");
 return h+"</div>";
}
function render(n){
 const d=L[n];
 app.innerHTML=`<h2>// ${d.t}</h2><div class="aim"><b>Aim:</b> By the end of the lesson you can ${d.aim}</div>`+d.s.map((s,i)=>`<details class="stage" ${i===0?"open":""}><summary><span>${s.s.map(x=>`<span class="sk">${x}</span>`).join("")}${s.t}</span><span class="min">${s.m} min</span></summary><div class="in">${s.w.map(wid).join("")}</div></details>`).join("");
}
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/\s+/g," ").trim();
app.addEventListener("click",e=>{
 const s=e.target.closest("[data-s]");if(s){spk(s.dataset.s);return}
 const c=e.target.closest(".cb");
 if(c){const p=c.parentNode;p.dataset.v=c.dataset.o;p.querySelectorAll(".cb").forEach(x=>x.classList.toggle("on",x===c));p.classList.remove("ok","no");return}
 const b=e.target.closest("button[data-do]");if(!b)return;
 const a=b.dataset.do;
 if(a==="rev"){b.closest(".r").classList.toggle("open");return}
 const w=b.closest(".w"),f=[...w.querySelectorAll(".ch,input.g")];
 let ok=0;
 f.forEach(x=>{
  const ans=x.dataset.a.split("|"),isC=x.classList.contains("ch");
  if(a==="key"){if(isC){x.dataset.v=ans[0];x.querySelectorAll(".cb").forEach(y=>y.classList.toggle("on",y.dataset.o===ans[0]))}else x.value=ans[0]}
  const v=isC?(x.dataset.v||""):x.value;
  const right=ans.map(norm).includes(norm(v));
  if(a==="key"||v!==""){x.classList.toggle("ok",right);x.classList.toggle("no",!right)}
  if(right)ok++;
 });
 w.querySelector(".sc").textContent=ok+" / "+f.length;
});
const tabs=document.querySelectorAll(".tab");
function go(n){tabs.forEach(x=>x.setAttribute("aria-selected",x.dataset.l===n));render(n)}
tabs.forEach(t=>t.addEventListener("click",()=>{location.hash=t.dataset.l;go(t.dataset.l);window.scrollTo(0,0)}));
const h0=["1","2","3","4"].includes(location.hash.slice(1))?location.hash.slice(1):"1";
go(h0);
</script>
